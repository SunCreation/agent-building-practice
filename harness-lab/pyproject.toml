[project]
name = "harness-lab"
version = "0.1.0"
description = "A readable Python agent with independent terminal benchmark evaluation"
requires-python = ">=3.13"
dependencies = ["openai==2.54.0", "httpx>=0.28,<1", "jsonschema>=4.26,<5"]

[project.optional-dependencies]
benchmark = ["harbor==0.22.0"]
dev = ["pytest>=9,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
