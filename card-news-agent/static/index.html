<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카드뉴스 작업실</title>
<style>
:root{--paper:#f7f5ef;--ink:#18253c;--blue:#244ddd;--orange:#ea622f;--line:#dcdedc;--muted:#657080;--white:#fff;--pale:#eaf0ff;--error:#9c3529}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.65}button,input,textarea,select{font:inherit}button,a,input,textarea,select{touch-action:manipulation}button{cursor:pointer;border:0}button:disabled{opacity:.45;cursor:not-allowed}a{color:var(--blue);text-underline-offset:3px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:4px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px 4vw;border-bottom:1px solid var(--line)}.brand{font-weight:850;font-size:20px;letter-spacing:-1px;display:flex;align-items:center;gap:12px}.mark{width:29px;height:35px;background:var(--blue);box-shadow:5px 5px 0 var(--orange);transform:rotate(-7deg)}.header-note{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1440px;margin:auto;min-height:calc(100vh - 88px)}aside{padding:38px 22px 36px 24px;border-right:1px solid var(--line)}main{padding:40px 5vw 90px;min-width:0}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--blue);text-transform:uppercase}.steps{list-style:none;padding:0;margin:26px 0 40px}.steps li{position:relative;padding:12px 0 12px 32px;font-size:14px;color:var(--muted)}.steps li:before{content:attr(data-number);position:absolute;left:0;top:14px;border:1px solid var(--line);width:21px;height:21px;border-radius:50%;font-size:11px;line-height:20px;text-align:center;background:var(--paper)}.steps li.active{font-weight:800;color:var(--blue)}.steps li.active:before{background:var(--blue);color:#fff;border-color:var(--blue)}.steps li.done:before{content:'✓';color:var(--blue)}.project-picker{width:100%;padding:9px 6px;border:1px solid var(--line);background:white;border-radius:7px;font-size:13px}h1{font-size:clamp(30px,4.4vw,58px);line-height:1.17;letter-spacing:-2px;margin:13px 0 22px;word-break:keep-all}h2{font-size:25px;letter-spacing:-.8px;margin:0 0 8px}h3{line-height:1.45;font-size:18px;margin:8px 0}p{margin:8px 0 18px}.muted{color:var(--muted)}.intro{max-width:660px}.topic-form{max-width:730px;margin-top:30px}.field-label{font-weight:700;display:block;margin-bottom:8px}input[type=text],textarea{width:100%;background:#fff;border:1px solid #b9c0c7;border-radius:9px;padding:14px 16px;color:var(--ink)}textarea{resize:vertical;min-height:84px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.primary,.secondary,.danger{padding:11px 19px;border-radius:8px;font-weight:750;display:inline-flex;justify-content:center;align-items:center;gap:8px;text-decoration:none}.primary{background:var(--blue);color:#fff}.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.danger{background:#fff1eb;color:var(--error)}.small{font-size:13px;padding:7px 11px}.topic-form .row{margin-top:14px}.topic-form input{font-size:20px}.landing-sample{margin-top:56px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;max-width:730px}.sample{padding:25px 20px;min-height:180px;border:1px solid var(--line);border-radius:10px;background:white}.sample:nth-child(2){background:var(--blue);color:white;transform:translateY(12px)}.sample strong{display:block;font-size:20px;margin-top:24px;line-height:1.4}.sample span{font-size:12px}.project-head{display:flex;justify-content:space-between;align-items:start;gap:18px;margin-bottom:30px}.project-head h1{font-size:36px;margin:6px 0 8px;letter-spacing:-1px}.badge{display:inline-block;font-size:12px;padding:4px 10px;border-radius:5px;background:var(--pale);color:var(--blue);font-weight:700}.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:25px;margin-bottom:24px}.section-top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.candidate{border:1px solid var(--line);border-radius:10px;padding:20px;position:relative;background:white}.candidate:has(input:checked){border:2px solid var(--blue);padding:19px;background:#f6f8ff}.candidate-label{display:flex;gap:12px;align-items:start;cursor:pointer}.candidate input{width:20px;height:20px;accent-color:var(--blue);flex-shrink:0;margin-top:4px}.candidate p{font-size:14px}.meta{font-size:12px;color:var(--muted)}.why{font-size:13px;color:var(--blue);border-top:1px solid var(--line);padding-top:10px;margin-top:15px}.sticky-action{position:sticky;bottom:16px;margin-top:22px;padding:14px 18px;border:1px solid var(--line);border-radius:10px;background:rgba(247,245,239,.97);display:flex;justify-content:space-between;gap:16px;align-items:center;box-shadow:0 4px 20px #18253c0c}.question-option{display:block;text-align:left;width:100%;padding:18px 20px;background:white;border:1px solid var(--line);border-radius:8px;margin:10px 0}.question-option:hover{border-color:var(--blue);background:var(--pale)}.question-option strong{display:block}.question-option span{font-size:14px;color:var(--muted)}.story-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.story-card{padding:20px;background:var(--paper);border-radius:9px;border-top:4px solid var(--blue)}.card-number{font-size:12px;font-weight:800;color:var(--blue)}.story-card p{white-space:pre-line;font-size:14px}.image-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.preview-card{min-width:0}.preview-card img{width:100%;display:block;background:var(--paper);border-radius:8px;border:1px solid var(--line)}.revision{margin-top:12px}.revision textarea{font-size:14px}.revision button{margin-top:8px}.downloads{display:flex;gap:10px;flex-wrap:wrap}.events{list-style:none;padding:0;margin:10px 0 0;max-height:360px;overflow:auto;overflow-anchor:none;scrollbar-gutter:stable}.event-timing{display:flex;gap:8px 20px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}.events li span{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}.events time{flex-shrink:0}.events li{display:flex;gap:14px;border-top:1px solid var(--line);padding:10px 0;font-size:13px}.events time{color:var(--muted);min-width:62px;font-variant-numeric:tabular-nums}.status-line{display:flex;align-items:center;gap:12px}.spinner{width:20px;height:20px;border:3px solid #dce4ff;border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite}.error-box{border:1px solid #efb9a9;background:#fff5f1;color:var(--error);border-radius:9px;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:20px}.sources{font-size:13px;overflow-wrap:anywhere}.empty{padding:24px;text-align:center;border:1px dashed var(--line);border-radius:9px;color:var(--muted)}.notice{position:fixed;bottom:20px;right:24px;max-width:min(550px,calc(100vw - 32px));background:var(--ink);color:white;border-radius:9px;padding:14px 22px;z-index:10;box-shadow:0 8px 30px #18253c33}.hidden{display:none!important}details summary{cursor:pointer;font-weight:700}pre{white-space:pre-wrap;word-break:break-word;font:13px/1.7 monospace}.busy-note{font-size:14px;color:var(--muted);margin-bottom:0}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:15px 20px}.steps{display:flex;margin:10px 0 15px;overflow:auto;gap:16px}.steps li{white-space:nowrap;font-size:12px;padding-left:26px}.project-picker{max-width:300px}.header-note{display:none}main{padding:28px 20px 65px}.grid,.story-cards,.image-grid{grid-template-columns:1fr}.landing-sample{gap:8px}.sample{padding:15px 12px;min-height:145px}.sample strong{font-size:16px}.project-head h1{font-size:29px}.panel{padding:20px}.sticky-action{bottom:8px;flex-wrap:wrap}.project-head{flex-wrap:wrap}.section-top{align-items:start;flex-wrap:wrap}}
</style></head><body>
<header><div class="brand"><span class="mark" aria-hidden="true"></span>카드뉴스 작업실</div><span class="header-note">조사하고, 고르고, 함께 완성하는 카드뉴스</span><button class="secondary small" id="new-project">새 주제</button></header>
<div class="layout"><aside><div class="eyebrow">Editorial workflow</div><ol class="steps" id="steps"></ol><label for="projects" class="field-label meta">저장된 작업</label><select id="projects" class="project-picker"><option value="">작업 선택</option></select><p class="meta">진행 상황과 선택은 저장됩니다. 창을 닫았다가 이어서 작업할 수 있습니다.</p></aside><main id="main"></main></div><div id="notice" role="alert" class="notice hidden"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let project=null, pending=false, selected=new Set(), timer=null, savedDrafts={}, noticeTimer, lastServerCheck=null, renderedProjectId=null;
const labels=['주제 입력','정보 선택','독자와 기획','이미지 제작','검수와 완성'];
const statuses={idle:'조사 준비',running:'제작 중',awaiting_selection:'정보 선택',waiting_for_user:'선택 기다리는 중',awaiting_approval:'기획 검토',preview:'완성본 검토',complete:'최종 승인 완료',error:'확인 필요',canceled:'작업 취소',interrupted:'작업 중단'};
const stageNames={research:'주제 조사',deepen:'선택한 정보 심층 조사',plan:'독자와 카드 기획',replan:'피드백을 반영해 기획 다시 작성',images:'이미지 생성',image:'이미지 생성',render:'카드 렌더링',revision:'선택한 카드 수정',revise:'선택한 카드 수정',produce:'이미지와 카드 제작',generate:'이미지와 카드 제작'};
function safeURL(v){try{const u=new URL(String(v),location.origin);return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}
function notify(msg){$('#notice').textContent=msg;$('#notice').classList.remove('hidden');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('#notice').classList.add('hidden'),7000)}
async function api(path,body){const opts=body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','x-studio-request':'1'},body:JSON.stringify(body)};const r=await fetch(path,opts);let data;try{data=await r.json()}catch{throw Error(`서버 응답을 읽을 수 없습니다 (${r.status}).`)}if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail||data.error||data));return data}
function level(){if(!project)return 0;if(['preview','complete'].includes(project.status)||['revise','revision'].includes(project.stage))return 4;if(['images','image','render','generate','revision','produce','revise'].includes(project.stage))return 3;if(['deepen','plan'].includes(project.stage)||project.story||project.question||['waiting_for_user','awaiting_approval'].includes(project.status))return 2;return 1}
function renderSteps(){const current=level();$('#steps').innerHTML=labels.map((x,i)=>`<li data-number="${i+1}" class="${i===current?'active':i<current?'done':''}" ${i===current?'aria-current="step"':''}>${x}</li>`).join('')}
async function refreshProjects(){try{const data=await api('/api/projects');const list=Array.isArray(data)?data:(data.projects||[]);$('#projects').innerHTML='<option value="">작업 선택</option>'+list.map(p=>`<option value="${esc(p.id)}" ${project?.id===p.id?'selected':''}>${esc(p.topic)} · ${esc(statuses[p.status]||p.status)}</option>`).join('')}catch(e){notify(e.message)}}
function setProject(p){lastServerCheck=Date.now();project=p;localStorage.setItem('card-news-project',p.id);if(p.status!=='awaiting_selection')selected=new Set(p.selected_ids||[]);render();poll();refreshProjects()}
function rememberDrafts(){if($('#plan-feedback'))savedDrafts.__plan=$('#plan-feedback').value;document.querySelectorAll('textarea[data-card]').forEach(el=>savedDrafts[el.dataset.card]=el.value)}
async function action(path,body={}){if(pending)return;pending=true;rememberDrafts();document.querySelectorAll('button').forEach(b=>b.disabled=true);try{setProject(await api(`/api/projects/${encodeURIComponent(project.id)}/${path}`,body))}catch(e){notify(e.message);render()}finally{pending=false;render()}}
function viewSignature(p){const {events,updated_at,last_activity_at,heartbeat_at,...view}=p;return JSON.stringify(view)}
function duration(ms){const sec=Math.max(0,Math.floor(ms/1000));return sec<60?`${sec}초`:`${Math.floor(sec/60)}분 ${sec%60}초`}
function timing(){if(!project)return;const now=Date.now(), start=Date.parse(project.stage_started_at||''), latest=Date.parse(project.events?.at(-1)?.time||'');const elapsed=$('#stage-elapsed'), activity=$('#last-activity'), server=$('#server-check');if(elapsed)elapsed.textContent=project.status==='running'&&Number.isFinite(start)?`현재 단계 경과 ${duration(now-start)}`:statuses[project.status]||project.status;if(activity)activity.textContent=Number.isFinite(latest)?`마지막 활동 ${duration(now-latest)} 전`:'첫 활동 기다리는 중';if(server)server.textContent=project.status==='running'?(lastServerCheck?`서버 응답 확인 ${duration(now-lastServerCheck)} 전`:'서버 상태 확인 중'):''}
function eventRow(e){return `<li><time>${esc(e.time?new Date(e.time).toLocaleTimeString('ko-KR',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}):'')}</time><span>${esc(e.message)}</span></li>`}
function updateEvents(){const list=$('#event-list');if(!list)return;const rows=project.events||[], oldCount=Number(list.dataset.count||0), follow=list.scrollHeight-list.scrollTop-list.clientHeight<40;const previousLast=list.dataset.last||'';if(oldCount>rows.length||(oldCount&&previousLast!==JSON.stringify(rows[oldCount-1]))){list.innerHTML=rows.map(eventRow).join('')}else if(rows.length>oldCount){if(!oldCount)list.innerHTML='';list.insertAdjacentHTML('beforeend',rows.slice(oldCount).map(eventRow).join(''))}if(!rows.length)list.innerHTML='<li>아직 기록된 작업이 없습니다.</li>';list.dataset.count=rows.length;list.dataset.last=rows.length?JSON.stringify(rows.at(-1)):'';if(follow)list.scrollTop=list.scrollHeight;const count=$('#event-count');if(count)count.textContent=`${rows.length}개 기록`;timing()}
function poll(){clearTimeout(timer);if(project?.status==='running'){timer=setTimeout(async()=>{const pid=project.id;try{const p=await api('/api/projects/'+encodeURIComponent(pid));if(p.id===project?.id){lastServerCheck=Date.now();const changed=viewSignature(p)!==viewSignature(project);rememberDrafts();project=p;if(changed)render();else updateEvents();if(p.status!=='running')refreshProjects()}}catch(e){notify('진행 상황 확인 실패: '+e.message)}poll()},2000)}}
function captureView(){if(renderedProjectId!==project?.id)return null;const details=[...document.querySelectorAll('#main details')].map(d=>({key:d.id||d.querySelector('summary')?.textContent,open:d.open}));const log=$('#event-list');const active=document.activeElement;return {details,scroll:log?.scrollTop,follow:log?log.scrollHeight-log.scrollTop-log.clientHeight<40:true,focus:active?.id,start:active?.selectionStart,end:active?.selectionEnd,value:active?.value}}
function restoreView(state){if(state){document.querySelectorAll('#main details').forEach(d=>{const prior=state.details.find(x=>x.key===(d.id||d.querySelector('summary')?.textContent));if(prior)d.open=prior.open});const el=state.focus?document.getElementById(state.focus):null;if(el){if(state.value!==undefined&&/^(INPUT|TEXTAREA)$/.test(el.tagName))el.value=state.value;el.focus({preventScroll:true});if(typeof el.setSelectionRange==='function'&&state.start!==null)try{el.setSelectionRange(state.start,state.end)}catch{}}}const log=$('#event-list');if(log)log.scrollTop=!state||state.follow?log.scrollHeight:state.scroll||0;renderedProjectId=project?.id;timing()}
setInterval(timing,1000);
function render(){const preservedView=captureView();$('#new-project').disabled=pending;renderSteps();if(!project){landing();renderedProjectId=null;return}const p=project;$('#main').innerHTML=`<div class="project-head"><div><div class="eyebrow">Your story in progress</div><h1>${esc(p.topic)}</h1><span class="badge">${esc(statuses[p.status]||p.status)}</span></div>${p.status==='running'?'<button class="secondary small" data-action="cancel">작업 취소</button>':''}</div>${p.error?`<div class="error-box" role="alert"><strong>작업을 확인해 주세요</strong><br>${esc(typeof p.error==='string'?p.error:JSON.stringify(p.error))}</div>`:''}${p.warning?`<details class="panel"><summary>조사 범위와 출처 확인 사항</summary><p class="muted">${esc(p.warning)}</p></details>`:''}${content()}${events()}`;bind();restoreView(preservedView);if(pending)document.querySelectorAll('main button').forEach(b=>b.disabled=true)}
function landing(){$('#main').innerHTML=`<div class="intro"><div class="eyebrow">From topic to story</div><h1>관심 있는 이야기,<br>넘겨 보고 싶은<br><span style="color:var(--blue)">카드뉴스로.</span></h1><p class="muted">주제를 입력하면 에이전트가 자료를 조사합니다. 다룰 소식을 직접 고르고, 독자와 전달 방식을 함께 정한 뒤 이미지를 만듭니다.</p></div><form id="topic-form" class="topic-form"><label class="field-label" for="topic">어떤 주제를 다룰까요</label><input type="text" id="topic" name="topic" placeholder="예: AI 최신소식" maxlength="200" required><div class="row"><button class="primary" type="submit">자료 조사 시작 <span aria-hidden="true">→</span></button><span class="meta">최신 주제는 날짜와 출처를 함께 확인합니다.</span></div></form><div class="landing-sample" aria-label="제작 과정"><div class="sample"><span>RESEARCH</span><strong>읽을 가치가 있는<br>정보를 찾고</strong></div><div class="sample"><span>YOUR CHOICE</span><strong>전하고 싶은<br>이야기를 고르고</strong></div><div class="sample"><span>CREATE</span><strong>독자에게 맞는<br>카드로 완성해요</strong></div></div>`;$('#topic-form').onsubmit=async e=>{e.preventDefault();if(pending)return;pending=true;$('#topic-form button').disabled=true;try{const p=await api('/api/projects',{topic:$('#topic').value.trim()});selected=new Set();savedDrafts={};setProject(p);pending=false;await action('research')}catch(err){notify(err.message);pending=false;render()}}}
function content(){const p=project;if(p.status==='idle')return '<div class="panel"><h2>조사를 시작할 준비가 되었습니다</h2><p class="muted">관련 소식을 찾아 선택 가능한 후보로 정리합니다.</p><button class="primary" data-action="research">자료 조사 시작</button></div>';if(p.status==='running')return `<div class="panel"><div class="status-line"><span class="spinner" aria-hidden="true"></span><h2>${esc(stageNames[p.stage]||'작업을 진행하고 있습니다')}</h2></div><p class="busy-note">조사와 이미지 생성은 몇 분 걸릴 수 있습니다. 진행 내역은 아래에 표시됩니다.</p></div>${p.story?story(false):''}`;if(p.status==='awaiting_selection')return candidates();if(p.status==='waiting_for_user')return question();if(p.status==='awaiting_approval')return story(true);if(['preview','complete'].includes(p.status))return previews();if(['error','canceled','interrupted'].includes(p.status))return `<div class="panel"><h2>${p.status==='canceled'?'작업이 취소되었습니다':'작업을 이어가기 전에 확인해 주세요'}</h2><p class="muted">위 오류와 진행 내역을 확인한 뒤 다시 시도할 수 있습니다. 저장된 작업은 그대로 남아 있습니다.</p><button class="primary" data-action="retry">다시 시도</button></div>${p.story?story(false):''}`;return '<div class="empty">작업 상태를 확인하고 있습니다.</div>'}
function candidates(){return `<div class="section-top"><div><h2>다룰 정보를 골라 주세요</h2><p class="muted">후보의 원문과 날짜를 확인하고 1–3개를 선택해 주세요.</p></div><span class="badge">${(project.candidates||[]).length}개 후보</span></div><div class="grid">${(project.candidates||[]).map(c=>`<article class="candidate"><label class="candidate-label"><input type="checkbox" name="candidate" value="${esc(c.id)}" ${selected.has(c.id)?'checked':''}><div><h3>${esc(c.title)}</h3><p>${esc(c.summary)}</p></div></label><div class="meta">발행 ${esc(c.published_at||'확인 필요')}${c.event_date?' · 사건 '+esc(c.event_date):''}</div><a href="${esc(safeURL(c.url))}" target="_blank" rel="noopener noreferrer" class="small">원문 확인 ↗</a>${c.why?`<div class="why">선정 이유 · ${esc(c.why)}</div>`:''}</article>`).join('')}</div><div class="sticky-action"><span id="selection-count">${selected.size}개 선택 / 최대 3개</span><button class="primary" id="select-candidates" ${selected.size<1||selected.size>3?'disabled':''}>선택한 정보 심층 조사 →</button></div>`}
function question(){const q=project.question;if(!q)return '<div class="empty">질문을 불러오지 못했습니다. 페이지를 새로고침해 주세요.</div>';return `<div class="panel"><div class="eyebrow">Editorial decision</div><h2 style="margin-top:12px">${esc(q.text)}</h2><p class="muted">${esc(project.research?.audience_reason||'선택한 방향을 다음 기획에 반영합니다.')}</p><details style="margin-bottom:20px"><summary>심층 조사 결과</summary><p>${esc(project.research?.summary||'')}</p><ul class="sources">${(project.research?.sources||[]).map(s=>`<li><a href="${esc(safeURL(s.url))}" target="_blank" rel="noopener noreferrer">${esc(s.title||s.url)}</a></li>`).join('')}</ul></details>${(q.options||[]).map((o,i)=>`<button class="question-option" data-answer="${i}"><strong>${esc(typeof o==='string'?o:o.label)}</strong>${o.description?`<span>${esc(o.description)}</span>`:''}</button>`).join('')}<form id="free-answer-form" style="margin-top:22px"><label class="field-label" for="free-answer">다른 방향 직접 입력</label><input id="free-answer" type="text" maxlength="400" placeholder="예: AI를 처음 배우는 직장인에게 실용적인 관점으로" required><button class="secondary small" style="margin-top:10px" type="submit">이 방향으로 기획</button></form></div>`}
function story(approval){const s=project.story;if(!s)return '';return `<section class="panel"><div class="section-top"><div><div class="eyebrow">Storyboard</div><h2 style="margin-top:8px">${esc(s.title)}</h2></div><span class="badge">${(s.cards||[]).length}장 구성</span></div><p><strong>독자</strong> · ${esc(s.audience)}</p><ol>${(s.hook_candidates||[]).map(h=>`<li>${esc(h)}</li>`).join('')}</ol>${s.selected_hook?`<p><strong>선택한 후킹 문구</strong> · ${esc(s.selected_hook)}</p>`:''}<p class="muted"><strong>후킹 방향</strong> · ${esc(s.hook_reason)}</p>${s.hook_design?`<details><summary>후킹 후보 비교 근거</summary>${s.hook_design.candidates.map(c=>`<article><h3>${esc(c.headline)}</h3><p><strong>독자 관심</strong> · ${esc(c.reader_interest)}</p><p><strong>넘겨 볼 이유</strong> · ${esc(c.curiosity)}</p><p><strong>근거</strong> · ${esc(c.evidence)}</p><p><strong>뒤 카드에서 풀 내용</strong> · ${esc(c.payoff)}</p><p class="muted"><strong>과장 검토</strong> · ${esc(c.risk)}</p></article>`).join('')}</details>`:''}<div class="story-cards">${(s.cards||[]).map((c,i)=>`<article class="story-card"><div class="card-number">CARD ${String(i+1).padStart(2,'0')}</div><h3>${esc(c.headline)}</h3><p>${esc(c.body)}</p>${c.image_prompt?`<details><summary class="meta">이미지 방향</summary><p>${esc(c.image_prompt)}</p></details>`:''}</article>`).join('')}</div>${sources()}${approval?`<form id="plan-feedback-form" style="margin-top:24px"><label class="field-label" for="plan-feedback">기획 수정 피드백</label><p class="meta">독자, 제목, 후킹 문구, 카드 순서 등 바꾸고 싶은 점을 적어 주세요. 전체 기획을 다시 작성한 뒤 확인할 수 있습니다.</p><textarea id="plan-feedback" maxlength="1000" required placeholder="예: 처음 배우는 사람이 이해하도록 쉽게 풀고, 첫 카드는 실생활에서 달라지는 점으로 시작해 줘.">${esc(savedDrafts.__plan||'')}</textarea><button type="submit" class="secondary" style="margin-top:10px">피드백으로 기획 다시 작성</button></form><div class="sticky-action"><span class="meta">이 구성으로 이미지를 생성하고 글자를 배치합니다.</span><button class="primary" data-action="approve">기획 승인 · 카드 제작</button></div>`:''}</section>`}
function sources(){const ss=project.story?.sources||[];return ss.length?`<details class="sources" style="margin-top:20px"><summary>확인한 출처 ${ss.length}개</summary><ul>${ss.map(s=>`<li><a href="${esc(safeURL(s.url))}" target="_blank" rel="noopener noreferrer">${esc(s.title||s.url)}</a></li>`).join('')}</ul></details>`:''}
function previews(){const all=project.artifacts||[];const imgs=all.filter(a=>(project.story?.cards||[]).some(c=>a.name===c.id+".png"));const cards=project.story?.cards||[];return `<section class="panel"><div class="section-top"><div><div class="eyebrow">Final review</div><h2 style="margin-top:8px">${project.final_approved||project.status==='complete'?'카드뉴스가 완성되었습니다':'카드뉴스를 검토해 주세요'}</h2></div><span class="badge">${imgs.length}개 이미지</span></div><p class="muted">글자 잘림, 출처와 사실관계, 이미지와 내용의 일치를 확인해 주세요. 필요한 카드만 수정할 수 있습니다.</p><div class="image-grid">${imgs.map((a,i)=>{const c=cards.find(c=>a.card_id===c.id)||cards[i];return `<article class="preview-card"><a href="${esc(safeURL(a.url))}" target="_blank" rel="noopener noreferrer"><img src="${esc(safeURL(a.url))}?v=${encodeURIComponent(project.version||0)}" alt="${esc(c?.headline||a.name)}" loading="lazy"></a><p class="meta">${esc(a.name)}</p>${c&&project.status!=='complete'?`<form class="revision" data-card="${esc(c.id)}"><label for="revision-${i}" class="meta">이 카드 수정 요청</label><textarea id="revision-${i}" data-card="${esc(c.id)}" placeholder="예: 제목을 더 짧게 바꾸고 본문을 두 문장으로 줄여 줘." required>${esc(savedDrafts[c.id]||'')}</textarea><button class="secondary small" type="submit">이 카드만 수정</button></form>`:''}</article>`}).join('')}</div>${!imgs.length?'<div class="empty">미리보기 이미지가 없습니다. 아래 파일과 진행 내역을 확인해 주세요.</div>':''}${sources()}${project.status==='preview'?'<div class="sticky-action"><span class="meta">확인한 결과를 최종본으로 승인합니다.</span><button class="primary" data-action="finalize">최종본 승인</button></div>':'<p class="badge" style="margin-top:20px">최종본 승인 완료</p>'}</section><section class="panel"><h2>파일 다운로드</h2><p class="muted">카드 이미지와 출처 기록을 함께 보관해 주세요.</p><div class="downloads">${all.map(a=>/\.zip$/i.test(a.name)&&project.status!=='complete'?`<span class="secondary small" aria-disabled="true" style="color:var(--muted)">${esc(a.name)} · 최종 승인 후 다운로드</span>`:`<a class="secondary small" href="${esc(safeURL(a.url))}" download>${esc(a.name)} ↓</a>`).join('')||'<span class="meta">아직 생성된 파일이 없습니다.</span>'}</div></section>`}
function events(){const rows=project.events||[];return `<details class="panel" id="progress-details" open><summary>작업 진행 내역 <span class="meta" id="event-count">${rows.length}개 기록</span></summary><div class="event-timing"><span id="stage-elapsed"></span><span id="last-activity"></span><span id="server-check"></span></div><ul class="events" id="event-list" tabindex="0" aria-label="시간순 작업 진행 기록" data-count="${rows.length}" data-last="${esc(rows.length?JSON.stringify(rows.at(-1)):'')}">${rows.map(eventRow).join('')||'<li>아직 기록된 작업이 없습니다.</li>'}</ul></details>`}
function bind(){if($('#plan-feedback-form')){$('#plan-feedback').oninput=()=>{savedDrafts.__plan=$('#plan-feedback').value;$('#plan-feedback').setCustomValidity('')};$('#plan-feedback-form').onsubmit=e=>{e.preventDefault();const field=$('#plan-feedback'),instruction=field.value.trim();if(!instruction){field.setCustomValidity('바꾸고 싶은 내용을 입력해 주세요.');field.reportValidity();return}action('plan-revisions',{instruction})};}document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('input[name=candidate]').forEach(el=>el.onchange=()=>{if(el.checked&&selected.size>=3){el.checked=false;notify('최대 3개까지 선택할 수 있습니다.');return}el.checked?selected.add(el.value):selected.delete(el.value);$('#selection-count').textContent=`${selected.size}개 선택 / 최대 3개`;$('#select-candidates').disabled=selected.size===0});if($('#select-candidates'))$('#select-candidates').onclick=()=>action('selection',{candidate_ids:[...selected]});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const q=project.question,o=q.options[Number(b.dataset.answer)];action('answers',{question_id:q.id,answer:typeof o==='string'?o:o.label})});if($('#free-answer-form'))$('#free-answer-form').onsubmit=e=>{e.preventDefault();const answer=$('#free-answer').value.trim();if(answer)action('answers',{question_id:project.question.id,answer})};document.querySelectorAll('form.revision').forEach(f=>f.onsubmit=e=>{e.preventDefault();action('revisions',{card_id:f.dataset.card,instruction:f.querySelector('textarea').value.trim()})})}
$('#new-project').onclick=()=>{if(pending)return;clearTimeout(timer);project=null;selected.clear();savedDrafts={};localStorage.removeItem('card-news-project');render();refreshProjects();$('#topic')?.focus()};$('#projects').onchange=async e=>{if(!e.target.value)return;try{selected.clear();savedDrafts={};setProject(await api('/api/projects/'+encodeURIComponent(e.target.value)))}catch(err){notify(err.message)}};
(async()=>{render();await refreshProjects();const id=localStorage.getItem('card-news-project');if(id)try{setProject(await api('/api/projects/'+encodeURIComponent(id)))}catch(e){localStorage.removeItem('card-news-project');notify('이전에 저장한 작업을 불러오지 못했습니다. '+e.message)}})();
</script></body></html>
